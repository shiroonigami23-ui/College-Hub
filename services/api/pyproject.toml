[project]
name = "college-hub-api"
version = "1.0.0"
description = "FastAPI backend for College Hub template"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn>=0.34.0",
  "pydantic>=2.10.4",
  "pytest>=8.3.4"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
